name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t avr-mini-projects .

      - name: Build all applications
        run: docker run --rm -v "$PWD:/src" avr-mini-projects make

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-atmega128
          path: build/*.hex
